services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in your .env file}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost
      DJANGO_DB_PATH: /app/data/db.sqlite3
    volumes:
      - ./docker-data:/app/data
      - ./docker-data/model-cache:/root/.cache
      - ./docker-data/keras-cache:/root/.keras
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/analytics/', timeout=10)"
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s

    command: >
      sh -c "python manage.py migrate &&
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 1
      --timeout 3600
      --access-logfile -
      --error-logfile -"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped